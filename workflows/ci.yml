name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Python-only test suite ───────────────────────────────────────────────────
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: install (pure Python)
        run: pip install -e ".[dev]"

      - name: lint
        run: |
          pip install ruff
          ruff check mmbt/ --select E,F,W --ignore E501
        continue-on-error: true

      - name: test
        run: python -m pytest tests/ -v --tb=short -x

  # ── Rust extension build + test ──────────────────────────────────────────────
  test-rust:
    name: test with Rust extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml') }}

      - name: install Python deps
        run: pip install -e ".[dev]" maturin

      - name: build Rust extension
        run: maturin develop --release
        # don't fail the whole CI if Rust compilation breaks — pure Python still works
        continue-on-error: true

      - name: test (with or without Rust extension)
        run: python -m pytest tests/ -v --tb=short -x

      - name: benchmark (smoke test — just check it runs)
        run: python benchmarks/bench_fifo.py
        continue-on-error: true

  # ── clean import check ────────────────────────────────────────────────────────
  import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e .
      - run: |
          python -c "
          from mmbt.core.types import OrderBook, Order, Fill, Side
          from mmbt.core.protocol import Strategy, RiskManager, Exchange
          from mmbt.core.portfolio import Portfolio
          from mmbt.engine.simple import BacktestEngine
          from mmbt.engine.pro import ProBacktestEngine
          from mmbt.engine.sweep import ParameterSweep, expand_grid
          from mmbt.latency.config import LatencyConfig
          from mmbt.latency.simulator import LatencySimulator
          from mmbt.queue.fifo import FIFOQueueSimulator, RUST_AVAILABLE
          from mmbt.queue.cancel_models import ReduceRatioCancelModel, ProbQueueCancelModel
          from mmbt.data.synthetic import SyntheticConfig, generate_ticks
          from mmbt.data.exchange import CSVExchange, ExchangeMetadata
          from mmbt.reporting.metrics import StrategyMetrics, BacktestReport
          print(f'all imports ok — RUST_AVAILABLE={RUST_AVAILABLE}')
          "
