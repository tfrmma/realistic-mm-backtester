[package]
name    = "mmbt-core"
version = "0.1.0"
edition = "2021"
description = "Rust hot path for mmbt — FIFO queue simulation via PyO3"
license = "MIT"

[lib]
name       = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }

# release profile: squeeze every cycle out of the inner loop
[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
