# ── Python-only build (default) ───────────────────────────────────────────────
[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# To build WITH the Rust extension (S5 hot path):
#   pip install maturin
#   maturin develop --release
# Then switch the build-system block above to:
#   requires      = ["maturin>=1.4,<2.0"]
#   build-backend = "maturin"
# and add [tool.maturin] below (see CONTRIBUTING.md).

[project]
name          = "mmbt"
version       = "0.1.0"
description   = "Institutional-grade FIFO market making backtester"
readme        = "README.md"
requires-python = ">=3.11"
license       = { text = "MIT" }
authors       = [{ name = "Taha", email = "fadilrezokt@gmail.com" }]

dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev  = ["pytest>=7.4", "matplotlib>=3.8", "plotly>=5.18", "pandas>=2.0"]
rust = ["maturin>=1.4"]   # needed to compile mmbt._core

[tool.setuptools.packages.find]
where   = ["."]
include = ["mmbt*"]

[tool.pytest.ini_options]
testpaths   = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length    = 100
target-version = "py311"

# ── maturin config (activate when switching build backend) ────────────────────
# [tool.maturin]
# python-source = "."
# module-name   = "mmbt._core"
# features      = ["pyo3/extension-module"]
